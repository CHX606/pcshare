[package]
name = "pcshare-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "电脑共享核心层：身份、存储、配对、连接、文件、传输、软件与进程"

[features]
default = ["embedded-ffmpeg"]
embedded-ffmpeg = ["pcshare-platform/embedded-ffmpeg"]

[dependencies]
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
constant_time_eq.workspace = true
fastrand.workspace = true
iroh.workspace = true
notify.workspace = true
pcshare-platform = { workspace = true, default-features = false }
pcshare-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
simple-dns.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
iroh = { workspace = true, features = ["unstable-custom-transports"] }
png.workspace = true
