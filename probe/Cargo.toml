[package]
name = "pcshare-probe"
version = "0.1.0"
edition = "2024"
description = "电脑共享项目的技术验证工具（第 0 阶段）"
publish = false

[dependencies]
# unstable-net-report：读取网络体检结果（路由器类型、到各中转服务器的延迟）
iroh = { version = "1.4", features = ["unstable-net-report"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "process"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
